spring:
  application:
    name: validation-engine

  # No JPA/MySQL — validation-engine is stateless; history is persisted via MQ → history-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    config:
      enabled: false

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

# ── Feign ─────────────────────────────────────────────────────────────────────
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      ai-service:
        connectTimeout: 3000
        readTimeout: 22000
      profile-service:
        connectTimeout: 3000
        readTimeout: 5000
      rules-service:
        connectTimeout: 3000
        readTimeout: 5000

# ── Resilience4j ──────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      profile-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      rules-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ai-cb:
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
  timelimiter:
    instances:
      ai-cb:
        timeoutDuration: 22s
      profile-cb:
        timeoutDuration: 5s
      rules-cb:
        timeoutDuration: 5s

logging:
  level:
    com.verinite.validation: DEBUG
    org.jpos: WARN