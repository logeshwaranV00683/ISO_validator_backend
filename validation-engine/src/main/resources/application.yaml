spring:
  application:
    name: validation-engine

  # No JPA/MySQL — validation-engine is stateless; history is persisted via MQ → history-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    config:
      enabled: false

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1     # ← ADD
    hostname: localhost

# ── Feign ─────────────────────────────────────────────────────────────────────
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      ai-service:
        connectTimeout: 3000
        readTimeout: 220000
      profile-service:
        connectTimeout: 3000
        readTimeout: 5000
      rules-service:
        connectTimeout: 3000
        readTimeout: 5000

# ── Resilience4j ──────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      profile-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      rules-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      ai-cb:
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 120s
        permittedNumberOfCallsInHalfOpenState: 2
  timelimiter:
    instances:
      ai-cb:
        timeoutDuration: 120s
      profile-cb:
        timeoutDuration: 5s
      rules-cb:
        timeoutDuration: 5s

logging:
  level:
    com.verinite.validation: DEBUG
    org.jpos: WARN

# Add to application.yaml/yml of each service (GAP 4)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: false