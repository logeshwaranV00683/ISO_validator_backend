spring:
  application:
    name: validation-engine
  datasource:
    url: jdbc:mysql://localhost:3306/iso_validator_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30s
    cache-names:
      - profileFormats
      - rulesCache
  cloud:
    config:
      enabled: false

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

# ── Feign configuration ──────────────────────────────────────────────────────
feign:
  circuitbreaker:
    enabled: true       # enables Feign + Resilience4j integration (uses fallback class)
  client:
    config:
      ai-service:
        connectTimeout: 3000
        readTimeout: 22000   # AI takes up to 20s; give 2s headroom

# ── Resilience4j — Circuit Breakers ─────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      # Profile service CB
      profile-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      # Rules service CB
      rules-cb:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      # AI service CB — CB open → AIServiceClientFallback returns null
      ai-service:
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
  timelimiter:
    instances:
      ai-service:
        timeoutDuration: 22s
      profile-cb:
        timeoutDuration: 5s
      rules-cb:
        timeoutDuration: 5s

logging:
  level:
    com.verinite.validation: DEBUG