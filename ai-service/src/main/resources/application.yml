server:
  port: 8085

spring:
  application:
    name: ai-service

  datasource:
    url: jdbc:mysql://localhost:3306/iso_validator_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1     # ← ADD
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

resilience4j:
  circuitbreaker:
    instances:
      ollama-cb:
        slidingWindowSize: 5
        failureRateThreshold: 60
        waitDurationInOpenState: 530s
        permittedNumberOfCallsInHalfOpenState: 2
        slidingWindowType: COUNT_BASED
  timelimiter:
    instances:
      ollama-cb:
        timeoutDuration: 90s

logging:
  level:
    com.verinite.ai: DEBUG

# Add to application.yaml/yml of each service (GAP 4)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method
  show-actuator: false

# BRD AI Feature
brd:
  upload:
    dir: ${BRD_UPLOAD_DIR:./brd-uploads}
    max-file-size: 10MB

feign:
  client:
    config:
      profile-service:
        connectTimeout: 3000
        readTimeout: 10000
      rules-service:
        connectTimeout: 3000
        readTimeout: 10000