server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**, /users/**
          filters:
            - StripPrefix=0

        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/profiles/**, /formats/**
          filters:
            - StripPrefix=0

        - id: rules-service
          uri: lb://rules-service
          predicates:
            - Path=/rules/**, /field-definitions/**
          filters:
            - StripPrefix=0

        - id: validation-engine
          uri: lb://validation-engine
          predicates:
            - Path=/validate/**
          filters:
            - StripPrefix=0

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai/**
          filters:
            - StripPrefix=0

        - id: history-service
          uri: lb://history-service
          predicates:
            - Path=/history/**, /audit/**
          filters:
            - StripPrefix=0

  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true