  server:
    port: 8888

  spring:
    application:
      name: config-server

    profiles:
      active: native

    cloud:
      config:
        server:
          native:
            search-locations: classpath:/configs

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true
      ip-address: 127.0.0.1     # ← ADD
      hostname: localhost

  management:
    endpoints:
      web:
        exposure:
          include: health,info
