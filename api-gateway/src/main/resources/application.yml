server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888"

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**, /users/**, /config/**
          filters:
            - StripPrefix=0

        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/profiles/**, /formats/**
          filters:
            - StripPrefix=0

        - id: rules-service
          uri: lb://rules-service
          predicates:
            - Path=/rules/**, /field-definitions/**
          filters:
            - StripPrefix=0

        - id: validation-engine
          uri: lb://validation-engine
          predicates:
            - Path=/validate/**
          filters:
            - StripPrefix=0

        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai/**
          filters:
            - StripPrefix=0

        - id: history-service
          uri: lb://history-service
          predicates:
            - Path=/history/**, /audit/**
          filters:
            - StripPrefix=0

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      # Rate limiter is DISABLED globally — enable per-route in production by uncommenting below.
      # Requires Redis. If Redis is not running, leaving this in default-filters causes 500 on
      # every request. Re-enable once Redis is confirmed available.
      #      - name: RequestRateLimiter
      #        args:
      #          redis-rate-limiter.replenishRate: 20
      #          redis-rate-limiter.burstCapacity: 40
      #          redis-rate-limiter.requestedTokens: 1
      #          key-resolver: "#{@userKeyResolver}"

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.verinite.gateway: DEBUG