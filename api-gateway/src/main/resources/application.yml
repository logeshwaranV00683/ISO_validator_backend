server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # ── Auth Service ─────────────────────────────────────────────────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**, /users/**, /config/**
          filters:
            - StripPrefix=0
          # NOTE: No JwtAuthFilter here — login/logout are public routes

        # ── Profile Service ───────────────────────────────────────────────────
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/profiles/**, /formats/**
          filters:
            - StripPrefix=0

        # ── Rules Service ─────────────────────────────────────────────────────
        - id: rules-service
          uri: lb://rules-service
          predicates:
            - Path=/rules/**, /field-definitions/**
          filters:
            - StripPrefix=0

        # ── Validation Engine ─────────────────────────────────────────────────
        - id: validation-engine
          uri: lb://validation-engine
          predicates:
            - Path=/validate/**
          filters:
            - StripPrefix=0

        # ── AI Service ────────────────────────────────────────────────────────
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/ai/**
          filters:
            - StripPrefix=0

        # ── History Service ───────────────────────────────────────────────────
        - id: history-service
          uri: lb://history-service
          predicates:
            - Path=/history/**, /audit/**
          filters:
            - StripPrefix=0

      # Global default filters applied to every route
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"

  # Redis — used by RequestRateLimiter (wired up in later days)
  data:
    redis:
      host: localhost
      port: 6379

# Eureka — register with service registry
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator — expose health + gateway route inspector
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG   # Shows route matching — useful Day 1
    com.verinite.gateway: DEBUG
