server:
  port: 8081

spring:
  application:
    name: auth-service

  # MySQL Database
  datasource:
    url: jdbc:mysql://localhost:3306/iso_validator_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  cloud:
    compatibility-verifier:
      enabled: false

  # RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# JWT — private key for signing (auth-service only)
jwt:
  private-key-path: classpath:keys/private.pem
  expiry-minutes: 60

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.verinite.auth_service: DEBUG