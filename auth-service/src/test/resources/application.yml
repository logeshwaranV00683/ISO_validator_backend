# ─── Swap MySQL → H2 in-memory (no real DB needed) ───────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:iso_validator_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop          # Create schema from entities, drop on exit
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ─── Disable RabbitMQ entirely — no broker needed for unit tests ─────────────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  cloud:
    compatibility-verifier:
      enabled: false

# ─── Disable Eureka — no registry needed for unit tests ──────────────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ─── JWT — keep same as main; keys are on classpath already ──────────────────
jwt:
  private-key-path: classpath:keys/private.pem
  public-key-path: classpath:keys/public.pem
  expiry-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.verinite.auth_service: DEBUG